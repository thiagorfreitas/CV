<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiago Freitas | CV</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Newsreader:opsz,ital,wght@6..72,0,300;6..72,0,400;6..72,0,500;6..72,1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="site-header" data-print-hide>
        <div class="header-inner">
            <span class="brand">Thiago Freitas — CV</span>
            <div class="header-controls">
                <div class="lang-switch">
                    <button id="pt-btn" class="lang-btn" data-lang="pt">PT</button>
                    <button id="en-btn" class="lang-btn" data-lang="en">EN</button>
                    <button id="es-btn" class="lang-btn" data-lang="es">ES</button>
                </div>
                <button id="theme-toggle" class="theme-btn" type="button"></button>
                <a id="pdf-btn" class="pdf-btn" download>
                    <span data-i18n="download"></span>
                </a>
            </div>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="hero-inner">
                <h1 class="hero-name">Thiago<br>Freitas</h1>
                <p class="hero-role" data-i18n="role"></p>
                <p class="hero-summary" data-i18n="summary"></p>
                <div class="hero-contact">
                    <span data-i18n="loc"></span>
                    <a href="mailto:thiagoribeirofreitas2@gmail.com">thiagoribeirofreitas2@gmail.com</a>
                    <a href="tel:+5561998122660">+55 61 99812-2660</a>
                    <a href="https://www.linkedin.com/in/thiago-ribeiro-freitas/" target="_blank" rel="noopener">LinkedIn ↗</a>
                </div>
            </div>
        </section>

        <section class="block" id="experience">
            <div class="block-inner">
                <h2 class="block-label" data-i18n="labelExp"></h2>
            </div>
            <div id="exp-list"></div>
        </section>

        <section class="block-row reveal" id="education">
            <div class="block-row-inner">
                <h2 class="block-label block-label-fixed" data-i18n="labelEdu"></h2>
                <div class="block-content">
                    <h3 class="entry-title" data-i18n="edu.school"></h3>
                    <div class="entry-sub" data-i18n="edu.degree"></div>
                    <div class="entry-meta"><span data-i18n="edu.dates"></span> · <span data-i18n="edu.place"></span></div>
                </div>
            </div>
        </section>

        <section class="block-row reveal" id="info">
            <div class="block-row-inner">
                <h2 class="block-label block-label-fixed" data-i18n="labelInfo"></h2>
                <div class="block-content info-content">
                    <div>
                        <div class="info-subhead" data-i18n="labelSkills"></div>
                        <div class="skills" id="skills-list"></div>
                    </div>
                    <div>
                        <div class="info-subhead" data-i18n="labelLangs"></div>
                        <div class="langs" id="langs-list"></div>
                    </div>
                    <div>
                        <div class="info-subhead" data-i18n="labelCerts"></div>
                        <div class="certs" id="certs-list"></div>
                    </div>
                </div>
            </div>
        </section>

        <footer class="site-footer">
            <div class="footer-inner" data-i18n="footer"></div>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
